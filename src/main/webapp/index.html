<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EMS — Employee Management System</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="splash-screen">

    <div class="splash-content">
      <div class="splash-logo">
        <div class="splash-logo-icon">EMS</div>
      </div>
      <h1 class="splash-title">
        Employee Management System
      </h1>


      <div class="splash-loader">
        <div class="splash-loader-bar"
             id="loader-bar"></div>
      </div>

      <p class="splash-loading-text"
         id="loading-text">
        Initializing...
      </p>

    </div>

  
    <div class="splash-circle splash-circle-1"></div>
    <div class="splash-circle splash-circle-2"></div>
    <div class="splash-circle splash-circle-3"></div>

  </div>

  <div id="login-page" class="hidden">

    <div class="login-card">
      <div class="login-brand">
        <div class="brand-logo">EMS</div>
        <h1>Welcome Back</h1>
        <p>Employee Management System</p>
      </div>

      <div id="login-error" class="alert-error hidden"></div>

      <div class="form-group">
        <label for="username">UserName</label>
        <input type="text"
               id="username"
               placeholder="Enter your username"
               autocomplete="username" />
        <span class="field-error" id="err-username"></span>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <div class="password-wrapper">
          <input type="password"
                 id="password"
                 placeholder="Enter your password"
                 autocomplete="current-password" />
          <button class="eye-btn"
                  onclick="togglePassword()"
                  type="button"
                  id="eye-btn">👁</button>
        </div>
        <span class="field-error" id="err-password"></span>
      </div>

      <button class="btn btn-primary btn-full"
              id="login-btn"
              onclick="handleLogin()">
        <span id="login-label">Sign In</span>
        <span id="login-spinner"
              class="spinner hidden"></span>
      </button>

    </div>
    <div class="login-bg-circle login-bg-1"></div>
    <div class="login-bg-circle login-bg-2"></div>

  </div>

  <script src="js/login.js"></script>
</body>
</html>
