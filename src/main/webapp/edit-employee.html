<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EMS — Edit Employee</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="dashboard-page">


  <aside class="sidebar">
    <div class="sidebar-brand">
      <div class="brand-logo-sm">EMS</div>
      <span>Employee MS</span>
    </div>
    <nav class="sidebar-nav">
      <a href="dashboard.html" class="nav-link">
        📋 All Employees
      </a>
      <a href="add-employee.html" class="nav-link">
        ➕ Add Employee
      </a>
    </nav>
    <div class="sidebar-footer">
      <button class="btn btn-ghost btn-full"
              onclick="logout()">
        🚪 Logout
      </button>
    </div>
  </aside>

 
  <main class="main-content">

    <header class="page-header">
      <div>
        <h2>Edit Employee</h2>
        <p class="subtitle" id="edit-subtitle">Loading...</p>
      </div>
      <a href="dashboard.html" class="btn btn-ghost">
        ← Back to List
      </a>
    </header>

    <div id="toast" class="toast hidden"></div>

    <div class="form-card">
      <div class="form-grid">

        <div class="form-group">
          <label>Employee ID</label>
          <input type="text" id="employee_id"
                 readonly class="input-readonly" />
        </div>

        <div class="form-group">
          <label>First Name <span class="required">*</span></label>
          <input type="text" id="first_name" />
          <span class="field-error" id="err-first_name"></span>
        </div>

        <div class="form-group">
          <label>Last Name <span class="required">*</span></label>
          <input type="text" id="last_name" />
          <span class="field-error" id="err-last_name"></span>
        </div>

        <div class="form-group">
          <label>Date of Birth <span class="required">*</span></label>
          <input type="date" id="dob" />
          <span class="field-error" id="err-dob"></span>
        </div>

        <div class="form-group">
          <label>Email <span class="required">*</span></label>
          <input type="email" id="email" />
          <span class="field-error" id="err-email"></span>
        </div>

        <div class="form-group">
          <label>Phone <span class="required">*</span></label>
          <input type="text" id="phone" maxlength="10" />
          <span class="field-error" id="err-phone"></span>
        </div>

        <div class="form-group">
          <label>Department <span class="required">*</span></label>
          <select id="department">
            <option value="">Select department</option>
            <option>Engineering</option>
            <option>HR</option>
            <option>Finance</option>
            <option>Marketing</option>
            <option>Operations</option>
            <option>Sales</option>
          </select>
          <span class="field-error" id="err-department"></span>
        </div>

        <div class="form-group">
          <label>Designation <span class="required">*</span></label>
          <input type="text" id="designation" />
          <span class="field-error" id="err-designation"></span>
        </div>

        <div class="form-group">
          <label>Date of Joining <span class="required">*</span></label>
          <input type="date" id="date_of_joining" />
          <span class="field-error" id="err-date_of_joining"></span>
        </div>

        <div class="form-group">
          <label>Salary (₹) <span class="required">*</span></label>
          <input type="number" id="salary" min="0" />
          <span class="field-error" id="err-salary"></span>
        </div>

        <div class="form-group form-group-full">
          <label>Address</label>
          <textarea id="address" rows="3"></textarea>
        </div>

      </div>

      <div class="form-actions">
        <a href="dashboard.html" class="btn btn-ghost">
          Cancel
        </a>
        <button class="btn btn-primary"
                onclick="submitEditEmployee()">
          <span id="submit-label">Save Changes</span>
          <span id="submit-spinner" class="spinner hidden"></span>
        </button>
      </div>
    </div>

  </main>

  <script src="js/api.js"></script>
  <script src="js/form-validation.js"></script>
  <script src="js/edit-employee.js"></script>
</body>
</html>
